<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노노그램</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --paper: #f7f7f7;
      --paper-light: #ffffff;
      --ink: #000000;
      --graphite: #c00000;
      --line: #000000;
      --filled-red: #000000;
    }

    body {
      min-height: 100vh;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 38px 12px 64px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: repeating-linear-gradient(0deg,
          transparent 0,
          transparent 31px,
          rgba(0, 0, 0, 0.045) 32px);
      position: relative;
    }

    .case-header {
      width: min(100%, 560px);
      margin: 8px auto 28px;
      padding: 18px 14px;
      box-shadow: 0 1px 0 var(--paper), 0 2px 0 rgba(0, 0, 0, 0.28);
    }

    .case-kicker {
      margin-bottom: 6px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .case-header h2 {
      margin-bottom: 0;
    }

    h2 {
      margin: 0 0 22px;
      color: var(--ink);
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      line-height: 1.35;
    }

    .result-header {
      margin: 0;
    }

    h3 {
      display: inline-block;
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }

    h5 {
      margin: 0;
    }

    .intro {
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .clue-switcher {
      width: min(100%, 430px);
      margin: 30px auto 38px;
      padding: 22px 14px 16px;
      border: 1px solid var(--ink);
      outline: 1px solid rgba(0, 0, 0, 0.35);
      outline-offset: 5px;
      background: linear-gradient(var(--paper-light), var(--paper));
    }

    .clue-viewport {
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .clue-track {
      display: flex;
      transition: transform 320ms ease;
      will-change: transform;
    }

    .clue {
      flex: 0 0 100%;
      min-width: 0;
    }

    .clue-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(0, 0, 0, 0.35);
    }

    .clue-button {
      width: 36px;
      height: 36px;
      padding: 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 28px auto 19px;
    }

    button {
      width: 126px;
      height: 42px;
      color: var(--ink);
      border: 1px solid #000000;
      border-radius: 0;
      background-color: var(--paper-light);
      font: 0.8rem sans-serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: color 140ms ease, background-color 140ms ease;
    }

    button:hover {
      color: #ffffff;
      background-color: #000000;
    }

    button.active {
      color: #ffffff;
      background-color: #000000;
    }

    .grid {
      --size: clamp(18px, calc((100vw - 50px) / 9), 37px);
      display: grid;
      grid-template-columns: repeat(9, var(--size));
      grid-template-rows: repeat(9, var(--size));
      position: relative;
      border: 3px solid #000000;
      background: #000000;
      gap: 1px;
      width: fit-content;
      margin: auto;
      touch-action: none;
    }

    .clue-grid {
      pointer-events: none;
    }

    .cell {
      width: var(--size);
      height: var(--size);
      position: relative;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background-color 100ms ease, box-shadow 100ms ease;
    }

    .cell.filled {
      background-color: var(--filled-red);
    }

    .cell.x-mark::before,
    .cell.x-mark::after {
      content: "";
      position: absolute;
      width: 68%;
      height: 3px;
      border-radius: 1px;
      background: var(--graphite);
      opacity: 1;
    }

    .cell.x-mark::before {
      transform: rotate(45deg);
    }

    .cell.x-mark::after {
      transform: rotate(-45deg);
    }

    hr {
      width: min(100%, 560px);
      margin: 38px auto 28px;
    }

    .result-section {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 18px 12px 20px;
      border: 1px solid var(--ink);
      outline: 1px solid rgba(0, 0, 0, 0.35);
      outline-offset: 5px;
      background-color: var(--paper-light);
    }

    .result-section h2 {
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--ink);
    }

    .result-section h5 {
      color: rgba(0, 0, 0, 0.7);
      font-weight: normal;
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    .result-section h5+h5 {
      margin-top: 12px;
    }

    .footer-note {
      margin-top: 42px;
      line-height: 1.7;
    }

    @media (max-width: 430px) {
      body {
        padding-top: 27px;
      }

      .grid {
        border-width: 4px;
        gap: 1px;
      }

      .clue-grid {
        --size: clamp(16px, calc((100vw - 86px) / 9), 37px);
      }

      button {
        width: 118px;
      }
    }
  </style>
</head>

<body>
  <header class="case-header">
    <div class="case-kicker">LAST CASE FILE</div>
    <h2>노노그램</h2>
  </header>
  <h3 class="intro">단서들을 확인하고 계산하여<br>최종 결과를 얻으세요.</h3>

  <div class="clue-switcher" aria-label="고정 단서 전환">
    <div class="clue-viewport">
      <div class="clue-track" id="clueTrack">
        <section class="clue">
          <h3>단서 1 - 집</h3>
          <div class="grid clue-grid" id="grid1"></div>
        </section>
        <section class="clue">
          <h3>단서 2 - 나무</h3>
          <div class="grid clue-grid" id="grid2"></div>
        </section>
        <section class="clue">
          <h3>단서 3 - 표정</h3>
          <div class="grid clue-grid" id="grid3"></div>
        </section>
      </div>
    </div>
    <div class="clue-buttons" role="group" aria-label="볼 단서 선택">
      <button class="clue-button active" type="button" data-clue="0" aria-label="단서 1 보기"
        aria-selected="true">1</button>
      <button class="clue-button" type="button" data-clue="1" aria-label="단서 2 보기" aria-selected="false">2</button>
      <button class="clue-button" type="button" data-clue="2" aria-label="단서 3 보기" aria-selected="false">3</button>
    </div>
  </div>

  <br>
  <br>
  <br>
  <div class="result-section">
    <h2>최종 결과</h2>
    <h5>XOR 계산을 통해 최종 결과를 얻으세요.</h5>
    <h5>- XOR 계산 방법 -<br>위 단서들에서 홀수개만큼 칠해진 칸은 칠하고,<br>짝수개만큼 칠해진 칸은 비우세요.</h5>
  </div>
  <div class="controls">
    <button id="fillBtn" class="active">색칠</button>
    <button id="xBtn">X 표시</button>
  </div>
  <div class="grid" id="interactiveGrid"></div>
  <h5 class="footer-note">용인고등학교</h5>

  <script src="script.js"></script>

</body>

</html>
